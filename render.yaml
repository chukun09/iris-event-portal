services:
  - type: web
    name: iris-event-portal
    env: static
    buildCommand: node scripts/build-config.js
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    envVars:
      - key: PORTAL_URL
        value: https://gamezone.minigames.vn/portal/
      - key: DEFAULT_CAMPAIGN_ID
        value: "24"
      - key: CLIENT_ID
        value: iris_app
      - key: CLIENT_NAME
        value: "Ứng dụng sự kiện IRIS 15 Năm"
      - key: ORG_NAME
        value: "Công ty cổ phần giải pháp công nghệ IRIS"
      - key: SECRET_KEY
        sync: false
      - key: IV_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
